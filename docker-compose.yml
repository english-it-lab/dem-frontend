# Production-like image: nginx serves the build and proxies /api to BACKEND_URL.
# Default BACKEND_URL targets a backend running on the host (uv or the backend
# repo's own compose, both publish :8000).
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_ADMIN_PAGE_ENABLED: ${VITE_ADMIN_PAGE_ENABLED:-false}
      VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-true}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux as well (Docker 20.10+).
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
