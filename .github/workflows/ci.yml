on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
      - development
      - stage
      - testing
      - test

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build application
        run: npm run build:prod

  resolve-env:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      environment_pascal: ${{ steps.env.outputs.environment_pascal }}
    steps:
      - id: env
        shell: bash
        run: |
          REF="${{ github.ref_name }}"

          if [[ "$REF" == "main" || "$REF" == "master" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "environment_pascal=Production" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == "stage" ]]; then
            echo "environment=stage" >> "$GITHUB_OUTPUT"
            echo "environment_pascal=Staging" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == "testing" || "$REF" == "test" ]]; then
            echo "environment=test" >> "$GITHUB_OUTPUT"
            echo "environment_pascal=Test" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
            echo "environment_pascal=Development" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [checks, resolve-env]
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/docker-build.yml@main
    with:
      service-folder: .
      image: ${{ vars.REGISTRY_URL }}/${{ github.repository }}/${{ vars.SERVICE_NAME }}:${{ github.run_number }}
    secrets:
      registry-user: ${{ secrets.REGISTRY_USER }}
      registry-token: ${{ secrets.REGISTRY_TOKEN }}

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [build, resolve-env]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: PANiXiDA-Infrastructure/ci-cd/.github/actions/ssh-docker-deploy@main
        with:
          server-user: ${{ vars.SERVER_USER }}
          server-host: ${{ vars.SERVER_HOST }}
          ssh-port: ${{ vars.SERVER_SSH_PORT }}
          ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

          service-folder: ${{ vars.PROJECT_FOLDER }}/${{ github.event.repository.name }}/${{ vars.SERVICE_NAME }}

          container-name: ${{ github.event.repository.name }}-${{ vars.SERVICE_NAME }}-${{ vars.ENV_SUFFIX }}
          image: ${{ vars.REGISTRY_URL }}/${{ github.repository }}/${{ vars.SERVICE_NAME }}:${{ github.run_number }}

          env-file: ${{ secrets.FRONTEND_ENV_FILE }}

          registry-url: ${{ vars.REGISTRY_URL }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
