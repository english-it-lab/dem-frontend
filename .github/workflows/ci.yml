on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
      - development
      - stage
      - testing
      - test

# Deploy job removed 2026-10: the server was decommissioned. See git history to restore.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build application
        run: npm run build:prod

  build:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [checks]
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/docker-build.yml@main
    with:
      service-folder: .
      image: ${{ vars.REGISTRY_URL }}/${{ github.repository }}/${{ vars.SERVICE_NAME }}:${{ github.run_number }}
    secrets:
      registry-user: ${{ secrets.REGISTRY_USER }}
      registry-token: ${{ secrets.REGISTRY_TOKEN }}
